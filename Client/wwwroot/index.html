<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loopback</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <!-- keep the ?v= stamp in sync with AppVersion so cached browsers refetch the styles -->
    <link rel="stylesheet" href="css/app.css?v=1.5.43" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Client.styles.css" rel="stylesheet" />
    <link href="_content/Z.Blazor.Diagrams/style.min.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>
<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Z.Blazor.Diagrams/script.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        // Unsaved-changes guard. Blazor toggles this flag via setUnsavedChanges; the
        // beforeunload handler triggers the browser's native "Leave site?" prompt when set.
        window.__lfUnsavedChanges = false;
        window.setUnsavedChanges = function (value) {
            window.__lfUnsavedChanges = !!value;
        };
        window.addEventListener('beforeunload', function (e) {
            if (window.__lfUnsavedChanges) {
                e.preventDefault();
                e.returnValue = ''; // required for Chrome/Edge to show the prompt
                return '';
            }
        });

        window.saveAsFile = function (filename, content) {
            const a = document.createElement('a');
            a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(content);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        // Renders an uploaded SVG to a PNG data URI. jsPDF's addImage takes raster images
        // only, so a vector logo or stamp has to be rasterized somewhere; doing it once at
        // upload keeps a single stored format and leaves every export path untouched.
        // maxPx is the long edge — 1400px across a ~45mm title-block box is ~790 dpi, well
        // past what a plotter resolves, so the seal still reads crisply in print.
        window.rasterizeSvg = function (dataUri, maxPx) {
            return new Promise(function (resolve, reject) {
                let svgText;
                try {
                    const comma = dataUri.indexOf(',');
                    const payload = dataUri.slice(comma + 1);
                    svgText = /;base64/i.test(dataUri.slice(0, comma))
                        ? decodeURIComponent(escape(atob(payload)))   // base64 -> UTF-8 text
                        : decodeURIComponent(payload);
                } catch (err) {
                    reject("That SVG couldn't be read.");
                    return;
                }

                const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
                const svg = doc.documentElement;
                if (!svg || svg.nodeName.toLowerCase() !== 'svg' || doc.querySelector('parsererror')) {
                    reject("That file isn't a valid SVG.");
                    return;
                }

                // Intrinsic size: the viewBox is the reliable source (unitless), since
                // width/height are often percentages or carry units like mm. Both can be
                // missing entirely, in which case a square default still beats failing.
                let w = 0, h = 0;
                const vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
                if (vb.length === 4 && vb[2] > 0 && vb[3] > 0) { w = vb[2]; h = vb[3]; }
                else {
                    w = parseFloat(svg.getAttribute('width')) || 0;
                    h = parseFloat(svg.getAttribute('height')) || 0;
                }
                if (!(w > 0) || !(h > 0)) { w = 512; h = 512; }

                const scale = maxPx / Math.max(w, h);
                const outW = Math.max(1, Math.round(w * scale));
                const outH = Math.max(1, Math.round(h * scale));

                // Chrome refuses to rasterize an <img> SVG with no concrete size, so pin
                // the output dimensions on the root element before handing it over.
                svg.setAttribute('width', outW);
                svg.setAttribute('height', outH);
                const sized = new XMLSerializer().serializeToString(svg);

                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    canvas.width = outW;
                    canvas.height = outH;
                    canvas.getContext('2d').drawImage(img, 0, 0, outW, outH);
                    try {
                        resolve(canvas.toDataURL('image/png'));
                    } catch (err) {
                        // Tainted canvas: the SVG pulls in something from another origin.
                        reject('That SVG links to an external image, so it cannot be converted. Export it with everything embedded and try again.');
                    }
                };
                img.onerror = function () { reject("That SVG couldn't be rendered."); };
                img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(sized)));
            });
        };

        // Reports the pixel size of the canvas viewport, used to compute a zoom-to-fit
        // transform for PDF export so the whole diagram is framed regardless of spread.
        window.getCanvasAreaSize = function () {
            const el = document.querySelector('.canvas-area');
            if (!el) return [0, 0];
            const r = el.getBoundingClientRect();
            return [r.width, r.height];
        };

        // Middle-mouse-button double-click on the canvas -> zoom-to-fit. A recovery
        // gesture for when the diagram has been panned/zoomed out of view. We suppress
        // the middle button's default (autoscroll on Windows, paste on X11) and use a
        // short time window to detect the double-press (more reliable across browsers
        // than relying on the middle button's click-count). Capture phase so it fires
        // even if the diagramming library handles the event on an inner element.
        window.registerMiddleDblClickZoom = function (dotNetRef) {
            const area = document.querySelector('.canvas-area');
            if (!area || area.__mdblZoomBound) return;
            area.__mdblZoomBound = true;
            let lastMid = 0;
            area.addEventListener('mousedown', function (e) {
                if (e.button !== 1) return;
                e.preventDefault();
                const now = Date.now();
                if (now - lastMid > 0 && now - lastMid < 400) {
                    lastMid = 0;
                    dotNetRef.invokeMethodAsync('ZoomToFitContent');
                } else {
                    lastMid = now;
                }
            }, true);
            area.addEventListener('auxclick', function (e) { if (e.button === 1) e.preventDefault(); }, true);
        };

        // Trims the surrounding whitespace from a captured canvas down to its actual
        // (non-white) content, so the exported diagram fills the page instead of sitting
        // in a corner. The C# side zooms the whole diagram into view before capture; this
        // crop removes the margins that fitting leaves around it.
        function cropToContent(canvas) {
            const ctx = canvas.getContext('2d');
            const { width, height } = canvas;
            const data = ctx.getImageData(0, 0, width, height).data;
            let minX = width, minY = height, maxX = -1, maxY = -1;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = (y * width + x) * 4;
                    if (data[i] < 245 || data[i + 1] < 245 || data[i + 2] < 245) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }
            if (maxX < 0) return canvas; // all white / empty
            const pad = 10;
            minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
            maxX = Math.min(width - 1, maxX + pad); maxY = Math.min(height - 1, maxY + pad);
            const cw = maxX - minX + 1, ch = maxY - minY + 1;
            const out = document.createElement('canvas');
            out.width = cw; out.height = ch;
            out.getContext('2d').drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);
            return out;
        }

        // Draws a drawing-sheet title block: a vertical strip down the right edge, laid out
        // like a standard AV/telecom sheet. Returns the rectangle left over for the drawing
        // itself, so the caller can fit the diagram into it.
        // tb = { enabled, companyName, companyAddress, companyPhone, companyWeb, client,
        //        projectName, location, discipline, projectNumber, drawnBy, checkedBy, date,
        //        revisions:[{number,date,description}], drawingTitle, drawingNumber, sheetName }
        function drawTitleBlock(pdf, tb, pageW, pageH, version) {
            const M = 6;                       // margin from paper edge to the outer border
            const inner = 1.6;                 // gap between the double border lines
            const stripW = Math.min(49, pageW * 0.113);
            const x0 = M, y0 = M, x1 = pageW - M, y1 = pageH - M;

            pdf.setLineWidth(0.7);
            pdf.setDrawColor(0);
            pdf.rect(x0, y0, x1 - x0, y1 - y0);                      // outer border
            pdf.setLineWidth(0.25);
            pdf.rect(x0 + inner, y0 + inner, (x1 - x0) - inner * 2, (y1 - y0) - inner * 2);

            if (!tb || !tb.enabled) {
                return { x: x0 + inner + 3, y: y0 + inner + 3,
                         w: (x1 - x0) - inner * 2 - 6, h: (y1 - y0) - inner * 2 - 6 };
            }

            const sx = x1 - inner - stripW;    // strip left edge
            const sTop = y0 + inner, sBot = y1 - inner;
            pdf.setLineWidth(0.4);
            pdf.line(sx, sTop, sx, sBot);

            const pad = 2.5;
            const txt = (s, x, y, size, opts) => {
                if (s === undefined || s === null || s === '') return;
                pdf.setFontSize(size);
                pdf.text(String(s), x, y, opts);
            };
            const rule = y => { pdf.setLineWidth(0.3); pdf.line(sx, y, x1 - inner, y); };

            // Trims a single-line cell value to its column, so a long revision description
            // can't run off the edge of the sheet.
            const fit = (s, maxW, size) => {
                if (s === undefined || s === null || s === '') return '';
                pdf.setFontSize(size);
                let str = String(s);
                if (pdf.getTextWidth(str) <= maxW) return str;
                while (str.length > 1 && pdf.getTextWidth(str + '…') > maxW) str = str.slice(0, -1);
                return str + '…';
            };

            let y = sTop;

            // --- Logo + company details ---
            // The uploaded logo is fitted inside the reserved box preserving its aspect
            // ratio; with no logo (or an image jsPDF can't read) the box prints as an empty
            // outline so there's still somewhere obvious to stamp one in by hand.
            const logoH = 20;
            const boxX = sx + pad, boxY = y + pad;
            const boxW = stripW - pad * 2, boxH = logoH - pad * 2;
            let logoDrawn = false;
            if (tb.logo) {
                try {
                    const props = pdf.getImageProperties(tb.logo);
                    const scale = Math.min(boxW / props.width, boxH / props.height);
                    const w = props.width * scale, h = props.height * scale;
                    pdf.addImage(tb.logo, props.fileType || 'PNG',
                                 boxX + (boxW - w) / 2, boxY + (boxH - h) / 2, w, h);
                    logoDrawn = true;
                } catch (err) {
                    console.warn('Title block logo could not be drawn:', err);
                }
            }
            if (!logoDrawn) {
                pdf.setLineWidth(0.25);
                pdf.setDrawColor(150);
                pdf.rect(boxX, boxY, boxW, boxH);
                pdf.setDrawColor(0);
            }
            y += logoH;

            pdf.setFont(undefined, 'bold');
            const company = [tb.companyName, tb.companyAddress, tb.companyPhone, tb.companyWeb].filter(Boolean);
            let cy = y + 3.2;
            for (const lineText of company) { txt(lineText, x1 - inner - pad, cy, 6.2, { align: 'right' }); cy += 3.0; }
            pdf.setFont(undefined, 'normal');
            y = Math.max(y + 4, cy) + 2;
            rule(y);

            // Everything from the revision grid down is ANCHORED TO THE BOTTOM of the strip,
            // the way a real drawing sheet works: the drawing number sits in a short box in
            // the bottom corner. These are worked out first so the project and stamp blocks
            // above can divide up exactly the space that's actually left.
            const revRows = 6, revH = 5.0;
            const numberBoxH = 20, titleBoxH = 20;
            const pairLead = 4.4;
            const pairsH = pairLead * 4 + 3;

            const numberTop = sBot - numberBoxH;
            const titleTop = numberTop - titleBoxH;
            const pairsTop = titleTop - pairsH;
            const revTop = Math.max(pairsTop - revRows * revH, y + 20);

            // --- Project block: rotated 90°, reading bottom-to-top like a CAD sheet ---
            // Takes the larger share of the space between the company details and the
            // revision grid; the stamp box gets the rest.
            const projBottom = y + (revTop - y) * 0.70;
            let px = sx + pad + 6;
            const rot = (s, x, size, bold) => {
                if (!s) return;
                pdf.setFont(undefined, bold ? 'bold' : 'normal');
                pdf.setFontSize(size);
                pdf.text(String(s), x, projBottom - pad, { angle: 90 });
                pdf.setFont(undefined, 'normal');
            };
            rot(tb.client, px, 13, true);        px += 7;
            rot(tb.projectName, px, 10, true);   px += 6;
            rot(tb.location, px, 8);             px += 5;
            rot(tb.discipline, px, 8);
            rule(projBottom);

            // --- Stamp box: from the project block down to the revision grid ---
            txt('STAMP', sx + pad, projBottom + 3.4, 5.6);
            // An uploaded seal is fitted into the box below the label, preserving its
            // aspect ratio and centered; with none, the box stays empty to stamp by hand.
            if (tb.stamp) {
                try {
                    const props = pdf.getImageProperties(tb.stamp);
                    const stampTop = projBottom + 5.0;
                    const availW = stripW - pad * 2;
                    const availH = Math.max(0, revTop - stampTop - pad);
                    if (availH > 2) {
                        const s = Math.min(availW / props.width, availH / props.height);
                        const w = props.width * s, h = props.height * s;
                        pdf.addImage(tb.stamp, props.fileType || 'PNG',
                                     sx + pad + (availW - w) / 2, stampTop + (availH - h) / 2, w, h);
                    }
                } catch (err) {
                    console.warn('Title block stamp could not be drawn:', err);
                }
            }
            rule(revTop);

            // --- Revisions grid ---
            // Proportional to the strip, so the description column doesn't vanish on a
            // narrow strip (Letter/A4) the way fixed widths did.
            const numW = stripW * 0.16, dateW = stripW * 0.32;
            pdf.setLineWidth(0.25);
            for (let r = 1; r <= revRows; r++) rule(revTop + r * revH);
            const revBottom = revTop + revRows * revH;
            pdf.line(sx + numW, revTop, sx + numW, revBottom);
            pdf.line(sx + numW + dateW, revTop, sx + numW + dateW, revBottom);
            txt('#', sx + 2, revTop + 3.4, 5);
            txt('DATE', sx + numW + 2, revTop + 3.4, 5);
            txt('DESCRIPTION', sx + numW + dateW + 2, revTop + 3.4, 5);
            (tb.revisions || []).slice(0, revRows - 1).forEach((rev, i) => {
                const ry = revTop + (i + 1) * revH + 3.4;
                txt(fit(rev.number, numW - 3, 5), sx + 2, ry, 5);
                txt(fit(rev.date, dateW - 3, 5), sx + numW + 2, ry, 5);
                txt(fit(rev.description, stripW - numW - dateW - 3, 5), sx + numW + dateW + 2, ry, 5);
            });

            // --- Label / value pairs ---
            let py = pairsTop;
            for (const [label, value] of [
                ['PROJECT NUM.', tb.projectNumber], ['DRAWN BY', tb.drawnBy],
                ['CHECKED BY', tb.checkedBy], ['DATE', tb.date]
            ]) {
                py += pairLead;
                txt(label, sx + pad, py, 5.6);
                txt(value, x1 - inner - pad, py, 5.6, { align: 'right' });
            }
            rule(titleTop);

            // --- Drawing title (per sheet) ---
            txt('DRAWING TITLE', sx + pad, titleTop + 3.6, 5.2);
            pdf.setFont(undefined, 'bold');
            // Set the size BEFORE measuring: splitTextToSize wraps at the *current* font
            // size, so wrapping at the label's smaller size then drawing at 8pt overflowed.
            pdf.setFontSize(8);
            const titleLines = pdf.splitTextToSize(String(tb.drawingTitle || tb.sheetName || ''), stripW - pad * 2);
            titleLines.slice(0, 3).forEach((t, i) => pdf.text(t, sx + pad, titleTop + 9.5 + i * 3.6));
            pdf.setFont(undefined, 'normal');
            rule(numberTop);

            // --- Drawing number: short box in the bottom corner ---
            txt('DRAWING NUMBER', sx + pad, numberTop + 3.6, 5.2);
            pdf.setFont(undefined, 'bold');
            txt(tb.drawingNumber || '', x1 - inner - pad, sBot - 3.5, 14, { align: 'right' });
            pdf.setFont(undefined, 'normal');

            // Build stamp, bottom-left of the drawing area
            pdf.setFontSize(5);
            pdf.setTextColor(130);
            pdf.text('Loopback v' + version, x0 + inner + 2, y1 - inner - 1.5);
            pdf.setTextColor(0);

            return { x: x0 + inner + 3, y: y0 + inner + 3,
                     w: (sx - 3) - (x0 + inner + 3), h: (y1 - inner - 3) - (y0 + inner + 3) };
        }

        window.exportToPdf = async function (title, version, bx, by, bw, bh, titleBlock) {
            const canvasArea = document.querySelector('.canvas-area');
            const originalBg = canvasArea.style.background;
            canvasArea.style.background = '#ffffff';

            const useBounds = typeof bw === 'number' && bw > 0 && bh > 0;
            let snapshot;
            if (useBounds) {
                // Full-content capture. html2canvas rasterizes inline SVGs clipped to the SVG
                // element's own box — and the diagram's connection lines live in an SVG layer
                // sized to the visible viewport while using raw diagram coordinates. So any
                // line geometry beyond the viewport's size is silently cut in the capture even
                // though it renders fine live (overflow: visible). The fix: restyle the CLONE
                // html2canvas renders (never the live page) so the layers cover the diagram's
                // full bounds — the SVG gets a matching viewBox, remapping raw coordinates
                // inside its rasterized box, and the HTML layer gets a matching translate.
                const scale = Math.min(2, 8000 / bw, 8000 / bh);
                snapshot = await html2canvas(canvasArea, {
                    backgroundColor: '#ffffff',
                    scale: scale,
                    width: bw,
                    height: bh,
                    windowWidth: bw + 300,
                    windowHeight: bh + 300,
                    scrollX: 0,
                    scrollY: 0,
                    onclone: function (doc) {
                        const area = doc.querySelector('.canvas-area');
                        if (!area) return;
                        area.style.width = bw + 'px';
                        area.style.height = bh + 'px';
                        area.style.overflow = 'visible';
                        for (let el = area.parentElement; el; el = el.parentElement) {
                            if (el.style) el.style.overflow = 'visible';
                        }
                        const dc = area.querySelector('.diagram-canvas');
                        if (dc) { dc.style.width = bw + 'px'; dc.style.height = bh + 'px'; dc.style.overflow = 'visible'; }
                        const htmlLayer = area.querySelector('.diagram-html-layer');
                        if (htmlLayer) htmlLayer.style.transform = 'translate(' + (-bx) + 'px, ' + (-by) + 'px) scale(1)';
                        const svgLayer = area.querySelector('.diagram-svg-layer');
                        if (svgLayer) {
                            svgLayer.setAttribute('viewBox', bx + ' ' + by + ' ' + bw + ' ' + bh);
                            svgLayer.setAttribute('width', bw);
                            svgLayer.setAttribute('height', bh);
                            svgLayer.style.width = bw + 'px';
                            svgLayer.style.height = bh + 'px';
                            svgLayer.style.transform = 'none';
                        }
                    }
                });
            } else {
                // No content bounds (empty diagram or older caller) — capture the visible view.
                snapshot = await html2canvas(canvasArea, { backgroundColor: '#ffffff', scale: 2 });
            }
            canvasArea.style.background = originalBg;

            // Bounds-based captures are already tight; the crop is the fallback path's trimmer.
            const cropped = useBounds ? snapshot : cropToContent(snapshot);
            const imgData = cropped.toDataURL('image/png');
            const { jsPDF } = window.jspdf;

            // Paper comes from the title block's sheet size (all landscape). jsPDF knows
            // 'tabloid' as 11x17; letter and a4 are built in too.
            const sizes = { '11x17': 'tabloid', 'Letter': 'letter', 'A4': 'a4' };
            const format = sizes[(titleBlock && titleBlock.sheetSize) || 'A4'] || 'a4';
            const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: format });

            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();

            let area;
            if (titleBlock && titleBlock.enabled) {
                area = drawTitleBlock(pdf, titleBlock, pageWidth, pageHeight, version);
            } else {
                // No title block — keep the original simple header.
                const margin = 10;
                pdf.setFontSize(16);
                pdf.setTextColor(40, 40, 40);
                pdf.text(title || 'Line Flow Diagram', margin, margin + 6);

                const date = new Date().toLocaleDateString();
                const stamp = version ? (date + '   ·   Loopback v' + version) : date;
                pdf.setFontSize(10);
                pdf.setTextColor(120, 120, 120);
                pdf.text(stamp, pageWidth - margin, margin + 6, { align: 'right' });
                pdf.setTextColor(0);

                pdf.setDrawColor(200, 200, 200);
                pdf.line(margin, margin + 10, pageWidth - margin, margin + 10);

                area = { x: margin, y: margin + 14,
                         w: pageWidth - margin * 2, h: pageHeight - (margin + 14) - margin };
            }

            // Fit the cropped diagram into the available area, preserving aspect ratio
            // (no stretching) and centering it.
            const aspect = cropped.width / cropped.height;
            let drawW = area.w;
            let drawH = drawW / aspect;
            if (drawH > area.h) { drawH = area.h; drawW = drawH * aspect; }

            const drawX = area.x + (area.w - drawW) / 2;
            const drawY = area.y + (area.h - drawH) / 2;

            pdf.addImage(imgData, 'PNG', drawX, drawY, drawW, drawH);
            pdf.save('lineflow-diagram.pdf');
        };
    </script>
</body>
