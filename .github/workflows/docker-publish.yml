# Builds the container image and publishes it to GitHub Container Registry (GHCR),
# so a server can run Loopback with `docker compose up -d` instead of building anything.
#
# When it runs:
#   * push to master        -> builds and publishes the ":edge" tag (latest development build)
#   * push of a v* tag      -> publishes ":1.5.31", ":1.5", and ":latest"
#   * pull request          -> builds ONLY (never publishes) as a safety check
#   * "Run workflow" button -> builds and publishes on demand
#
# No secrets to configure: GITHUB_TOKEN is provided automatically and the `packages: write`
# permission below is what lets it push to ghcr.io.
#
# First publish note: new GHCR packages default to private. To let others pull without
# logging in, go to the package page on GitHub -> Package settings -> Change visibility.

name: Docker image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # JEwaldt27/Loopback -> lowercased below

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      # Sets up Buildx, Docker's extended builder — needed for the layer caching below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR requires the image name to be entirely lowercase; the repo name is not.
      - name: Lowercase the image name
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      # Skipped on pull requests, which build but never publish.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the image tags/labels from what triggered the run (see header comment).
      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse unchanged layers between runs so most builds skip the NuGet restore.
          cache-from: type=gha
          cache-to: type=gha,mode=max
