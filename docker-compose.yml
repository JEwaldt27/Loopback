# One-command self-hosting for Loopback.
#
#   docker compose up -d      start (downloads the image the first time)
#   docker compose logs -f    watch the log output
#   docker compose down       stop and remove the container (your data survives)
#   docker compose pull && docker compose up -d      upgrade to the latest image
#
# Then open http://localhost:8080 and create the first admin account.

services:
  loopback:
    # Pre-built image from GitHub Container Registry. To build from this source tree
    # instead, comment this line out and uncomment "build: ." below.
    image: ghcr.io/jewaldt27/loopback:latest
    # build: .

    container_name: loopback

    # Start again automatically after a reboot or a crash (but stay stopped if you
    # deliberately stopped it).
    restart: unless-stopped

    ports:
      # "<host port>:<container port>" — the container always listens on 8080 internally.
      # Change only the LEFT number to serve on a different port, e.g. "5052:8080".
      - "8080:8080"

    volumes:
      # The device library and user accounts live here. Because this is a named volume
      # managed by Docker, the data survives "docker compose down", image upgrades, and
      # container recreation. Removing it (docker volume rm loopback-data) erases both.
      - loopback-data:/data

volumes:
  loopback-data:
